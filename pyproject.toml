[project]
name = "aiod-docs"
version = "0"
description = "Documentation site for AI OnDemand (AIoD)"
requires-python = ">=3.11"

[dependency-groups]
# Everything needed to build the site locally: `uv sync --group docs`
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
    "mkdocs-material-extensions>=1.3,<2",
    "mkdocs-glightbox>=0.5,<1",
]

# Nothing here is packaged or published — this repo only builds a site
[tool.uv]
package = false
