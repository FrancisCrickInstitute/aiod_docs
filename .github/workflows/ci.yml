name: ci
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: write
jobs:
  # The site is generated from aiod_registry at build time, so a broken macro or a
  # manifest the generator can't handle only shows up at build. Catch that on the PR
  # rather than when it is already on main and deploying.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Capped below 3.13 by aiod-registry, which the model reference needs
          python-version: '3.12'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync --group docs
      - run: uv run mkdocs build

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Capped below 3.13 by aiod-registry, which the model reference needs
          python-version: '3.12'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-
      - run: uv sync --group docs
      - run: uv run mkdocs gh-deploy --force
